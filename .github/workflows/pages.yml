name: Publish portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '20 6 * * *'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh curated release data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/update_catalog.py
      - name: Prepare static website
        run: |
          mkdir _site
          cp index.html robots.txt sitemap.xml _site/
          touch _site/.nojekyll
          cp -r assets data _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
